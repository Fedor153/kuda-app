<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Куда сходить</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берутся из темы Telegram; запасные — для открытия в обычном браузере */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #1c1c1e; --bg2: #000000; --text: #ffffff; --hint: #8e8e93;
      --link: #64b5ef; --btn: #2ea6ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg2); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 26px; margin: 4px 0 2px; }
  h2 { font-size: 21px; margin: 0 0 12px; }
  .sub { color: var(--hint); margin: 0 0 18px; }
  .section { color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 18px 4px 8px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat {
    background: var(--bg); border-radius: var(--radius); padding: 16px 14px; border: 0;
    text-align: left; color: var(--text); font: inherit; cursor: pointer;
  }
  .cat .emoji { font-size: 30px; display: block; margin-bottom: 8px; }
  .cat b { display: block; font-size: 16px; }
  .cat small { color: var(--hint); }
  .cat:active, .card:active { transform: scale(.98); }

  .wide {
    display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 10px;
    background: var(--bg); border-radius: var(--radius); padding: 14px; border: 0;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .wide .emoji { font-size: 24px; }
  .wide span:last-child { margin-left: auto; color: var(--hint); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  .filter-label { font-size: 13px; color: var(--hint); margin: 12px 4px 6px; }

  .card {
    display: flex; gap: 12px; align-items: center; width: 100%; margin-bottom: 10px;
    background: var(--bg); border-radius: var(--radius); padding: 10px; border: 0;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .thumb {
    flex: none; width: 64px; height: 64px; border-radius: 10px; background: var(--bg2);
    display: grid; place-items: center; font-size: 28px; overflow: hidden;
  }
  .thumb img, .hero img { width: 100%; height: 100%; object-fit: cover; }
  .card b { display: block; }
  .card small { color: var(--hint); }
  .empty { text-align: center; color: var(--hint); padding: 40px 10px; }

  .hero {
    height: 200px; border-radius: var(--radius); background: var(--bg); overflow: hidden;
    display: grid; place-items: center; font-size: 72px; margin-bottom: 14px;
  }
  .box { background: var(--bg); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .box p { margin: 0; }
  .row { display: flex; gap: 10px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--bg2); }
  .tag { color: var(--hint); margin: -6px 0 12px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600;
    background: var(--bg); color: var(--link); text-align: center; text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--btn); color: var(--btn-text); }

  label { display: block; font-size: 13px; color: var(--hint); margin: 12px 4px 6px; }
  input {
    width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit;
    background: var(--bg); color: var(--text); outline: none;
  }
  .stepper { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 12px; padding: 6px; }
  .stepper button {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--bg2);
    color: var(--text); font-size: 22px; cursor: pointer;
  }
  .stepper b { flex: 1; text-align: center; font-size: 18px; }
  .result { background: var(--bg); border-radius: var(--radius); padding: 14px; margin: 16px 0 10px; user-select: text; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(80px);
    background: rgba(0,0,0,.8); color: #fff; padding: 10px 16px; border-radius: 999px;
    transition: transform .25s; pointer-events: none; font-size: 14px;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .browser-back { display: none; margin-bottom: 10px; }
  :root:not(.tg) .browser-back.visible { display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (inTelegram) {
  document.documentElement.classList.add("tg");
  tg.ready();
  tg.expand();
}

const DATE_CATEGORY = "Для свидания";
const EMOJI = {
  "Активности": "🧗", "Еда": "🍽", "Культура": "🎭",
  "Прогулки": "🌳", "Вечер": "🌙", [DATE_CATEGORY]: "💘",
};
const BUDGETS = [["any", "Любой"], ["500", "до 500 ₽"], ["1500", "до 1500 ₽"]];
const AUDIENCES = [["any", "Не важно"], ["один", "🙋 Один"], ["пара", "👫 Пара"], ["компания", "👨‍👩‍👧 Компания"]];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля",
                "августа", "сентября", "октября", "ноября", "декабря"];

let places = [];
let favs = new Set();
let state = { view: "home" };
const stack = [];
const app = document.getElementById("app");

// ---------- Помощники ----------

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const emoji = (cat) => EMOJI[cat] || "📍";
const haptic = (type = "light") => inTelegram && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type);

function price(p) {
  if (p.avg_check === 0) return "бесплатно";
  if (p.avg_check) return `~${p.avg_check} ₽`;
  return "";
}

function peopleWord(n) {
  if (n % 10 === 1 && n % 100 !== 11) return "человека";
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return "человека";
  return "человек";
}

function placesWord(n) {
  if (n % 10 === 1 && n % 100 !== 11) return `${n} место`;
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return `${n} места`;
  return `${n} мест`;
}

function normalizeLink(link) {
  link = (link || "").trim();
  if (!link) return null;
  if (link.startsWith("@")) link = "https://t.me/" + link.slice(1);
  else if (!/^https?:\/\//.test(link)) link = "https://" + link;
  return /^https?:\/\/[^\s/]+\.[^\s/]+(\/\S*)?$/.test(link) ? link : null;
}

function openLink(url) {
  if (inTelegram && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
  else if (inTelegram) tg.openLink(url);
  else window.open(url, "_blank");
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

// ---------- Избранное: в облаке Telegram, а вне Telegram — в браузере ----------

const useCloud = inTelegram && tg.CloudStorage && tg.isVersionAtLeast("6.9");

function loadFavs() {
  return new Promise((resolve) => {
    const done = (raw) => {
      try { favs = new Set(JSON.parse(raw || "[]")); } catch { favs = new Set(); }
      resolve();
    };
    if (useCloud) tg.CloudStorage.getItem("favs", (err, v) => done(err ? null : v));
    else { try { done(localStorage.getItem("favs")); } catch { done(null); } }
  });
}

function saveFavs() {
  const raw = JSON.stringify([...favs]);
  if (useCloud) tg.CloudStorage.setItem("favs", raw);
  else { try { localStorage.setItem("favs", raw); } catch {} }
}

// ---------- Данные ----------

function categories() {
  const list = [];
  for (const p of places) if (!list.includes(p.category) && p.category !== DATE_CATEGORY) list.push(p.category);
  if (places.some((p) => p.audience.includes("пара"))) list.push(DATE_CATEGORY);
  return list;
}

function inCategory(cat) {
  return cat === DATE_CATEGORY
    ? places.filter((p) => p.audience.includes("пара"))
    : places.filter((p) => p.category === cat);
}

function filtered() {
  return inCategory(state.category).filter((p) => {
    if (state.budget !== "any" && !(p.avg_check != null && p.avg_check <= +state.budget)) return false;
    if (state.who !== "any" && !p.audience.includes(state.who)) return false;
    if (state.district !== "any" && p.district !== state.district) return false;
    return true;
  }).sort((a, b) => a.name.localeCompare(b.name, "ru"));
}

const byId = (id) => places.find((p) => p.id === id);

// ---------- Навигация ----------

function go(view, patch = {}) {
  stack.push(state);
  state = { ...state, ...patch, view };
  haptic();
  render();
  window.scrollTo(0, 0);
}

function back() {
  if (!stack.length) return;
  state = stack.pop();
  render();
}

if (inTelegram) tg.BackButton.onClick(back);

// ---------- Экраны ----------

function cardHtml(p) {
  const thumb = p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.replaceWith('${emoji(p.category)}')">` : emoji(p.category);
  const meta = [price(p), p.district].filter(Boolean).join(" · ");
  return `<button class="card" data-place="${p.id}">
    <div class="thumb">${thumb}</div>
    <div><b>${esc(p.name)}${favs.has(p.id) ? " ⭐" : ""}</b><small>${esc(meta)}</small></div>
  </button>`;
}

const views = {
  home() {
    const cats = categories();
    return `
      <h1>Куда сходить?</h1>
      <p class="sub">Выбери, что хочется сегодня</p>
      <div class="grid">
        ${cats.map((c) => `
          <button class="cat" data-cat="${esc(c)}">
            <span class="emoji">${emoji(c)}</span>
            <b>${esc(c)}</b><small>${placesWord(inCategory(c).length)}</small>
          </button>`).join("")}
      </div>
      <button class="wide" data-go="favorites">
        <span class="emoji">⭐</span><b>Избранное</b><span>${favs.size || ""}</span>
      </button>`;
  },

  list() {
    const districts = [...new Set(inCategory(state.category).map((p) => p.district).filter(Boolean))].sort();
    const chips = (key, options) => `<div class="chips">${options.map(([v, label]) =>
      `<button class="chip ${state[key] === v ? "on" : ""}" data-filter="${key}" data-value="${esc(v)}">${esc(label)}</button>`
    ).join("")}</div>`;
    const results = filtered();
    return `
      <h2>${emoji(state.category)} ${esc(state.category)}</h2>
      <div class="filter-label">Бюджет на человека</div>${chips("budget", BUDGETS)}
      <div class="filter-label">С кем идёшь</div>${chips("who", AUDIENCES)}
      ${districts.length > 1 ? `<div class="filter-label">Район</div>${chips("district", [["any", "Любой"], ...districts.map((d) => [d, d])])}` : ""}
      <div class="section">Нашлось: ${results.length}</div>
      ${results.length ? results.map(cardHtml).join("") : `<div class="empty">Ничего не нашлось 😕<br>Попробуй смягчить фильтры</div>`}`;
  },

  favorites() {
    const list = places.filter((p) => favs.has(p.id));
    return `
      <h2>⭐ Избранное</h2>
      ${list.length ? list.map(cardHtml).join("")
        : `<div class="empty">Пока пусто.<br>Открой место и нажми «В избранное».</div>`}`;
  },

  place() {
    const p = byId(state.placeId);
    if (!p) return `<div class="empty">Этого места больше нет 😕</div>`;
    const link = normalizeLink(p.link);
    const fav = favs.has(p.id);
    const rows = [
      p.address && ["📍", esc(p.address)],
      price(p) && ["💰", p.avg_check === 0 ? "Бесплатно" : `Средний чек ${price(p)}`],
      p.audience && ["👥", "Подойдёт: " + esc(p.audience)],
      p.phone && ["📞", esc(p.phone)],
    ].filter(Boolean);
    return `
      <div class="hero">${p.photo ? `<img src="${esc(p.photo)}" alt="" onerror="this.replaceWith('${emoji(p.category)}')">` : emoji(p.category)}</div>
      <h2>${esc(p.name)}</h2>
      <p class="tag">${esc([p.category, p.district].filter(Boolean).join(" · "))}</p>
      ${p.description ? `<div class="box"><p>${esc(p.description)}</p></div>` : ""}
      <div class="box">${rows.map(([i, t]) => `<div class="row"><span>${i}</span><span>${t}</span></div>`).join("")}</div>
      <div class="actions">
        ${p.phone ? `<a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">📞 Позвонить</a>` : ""}
        ${link ? `<button class="btn" data-link="${esc(link)}">💬 Написать</button>` : ""}
      </div>
      <button class="btn primary" data-go="booking">📝 Текст для брони</button>
      <div style="height:10px"></div>
      <button class="btn" data-fav="${p.id}">${fav ? "✅ В избранном" : "⭐ В избранное"}</button>`;
  },

  booking() {
    const p = byId(state.placeId);
    const b = state.booking || (state.booking = { date: "", time: "19:00", guests: 2, name: "", phone: "" });
    if (!b.name && inTelegram && tg.initDataUnsafe.user) b.name = tg.initDataUnsafe.user.first_name || "";
    return `
      <h2>📝 Бронь</h2>
      <p class="tag">${esc(p ? p.name : "")}</p>
      <label>Дата</label><input type="date" id="b-date" value="${esc(b.date)}">
      <label>Время</label><input type="time" id="b-time" value="${esc(b.time)}">
      <label>Сколько человек</label>
      <div class="stepper"><button data-step="-1">−</button><b id="b-guests">${b.guests}</b><button data-step="1">+</button></div>
      <label>Имя</label><input id="b-name" value="${esc(b.name)}" placeholder="Анна" autocomplete="given-name">
      <label>Телефон</label><input id="b-phone" type="tel" value="${esc(b.phone)}" placeholder="+7 900 123-45-67" autocomplete="tel">
      <div class="result" id="b-result"></div>
      <button class="btn primary" id="b-copy">📋 Скопировать текст</button>
      ${p && (p.phone || normalizeLink(p.link)) ? `<div style="height:10px"></div><div class="actions">
        ${p.phone ? `<a class="btn" href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">📞 Позвонить</a>` : ""}
        ${normalizeLink(p.link) ? `<button class="btn" data-link="${esc(normalizeLink(p.link))}">💬 Написать</button>` : ""}
      </div>` : ""}`;
  },
};

function bookingText() {
  const b = state.booking;
  let date = "…";
  if (b.date) {
    const [y, m, d] = b.date.split("-").map(Number);
    date = `${d} ${MONTHS[m - 1]}`;
  }
  return `Здравствуйте! Хочу забронировать на ${date} в ${b.time || "…"} на ${b.guests} ${peopleWord(b.guests)}. ` +
         (`Имя: ${b.name.trim() || "…"}, телефон: ${b.phone.trim() || "…"}.`).replace("….", "…");
}

function render() {
  app.innerHTML =
    `<button class="chip browser-back ${stack.length ? "visible" : ""}" data-back>← Назад</button>` +
    views[state.view]();
  if (inTelegram) stack.length ? tg.BackButton.show() : tg.BackButton.hide();

  if (state.view === "booking") {
    const update = () => {
      const b = state.booking;
      b.date = document.getElementById("b-date").value;
      b.time = document.getElementById("b-time").value;
      b.name = document.getElementById("b-name").value;
      b.phone = document.getElementById("b-phone").value;
      document.getElementById("b-result").textContent = bookingText();
    };
    app.querySelectorAll("input").forEach((i) => i.addEventListener("input", update));
    update();
  }
}

// Один обработчик на все нажатия
app.addEventListener("click", async (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  const d = el.dataset;

  if ("back" in d) return back();
  if (d.cat) return go("list", { category: d.cat, budget: "any", who: "any", district: "any" });
  if (d.go) return go(d.go);
  if (d.place) return go("place", { placeId: +d.place, booking: null });
  if (d.link) return openLink(d.link);

  if (d.filter) {
    state[d.filter] = d.value;
    haptic("soft");
    return render();
  }
  if (d.fav) {
    const id = +d.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    saveFavs();
    haptic("medium");
    toast(favs.has(id) ? "Добавлено в избранное ⭐" : "Убрано из избранного");
    return render();
  }
  if (d.step) {
    const b = state.booking;
    b.guests = Math.min(50, Math.max(1, b.guests + +d.step));
    document.getElementById("b-guests").textContent = b.guests;
    document.getElementById("b-result").textContent = bookingText();
    return haptic("soft");
  }
  if (el.id === "b-copy") {
    const text = bookingText();
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("b-result"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      document.execCommand("copy");
    }
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    toast("Скопировано! Отправь заведению 👌");
  }
});

// ---------- Старт ----------

(async () => {
  try {
    const res = await fetch("places.json?v=" + Date.now());
    places = await res.json();
  } catch {
    app.innerHTML = `<div class="empty">Не удалось загрузить места 😕<br>Попробуй позже</div>`;
    return;
  }
  await loadFavs();
  render();
})();
</script>
</body>
</html>
