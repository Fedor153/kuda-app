<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Куда сходить</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берутся из темы Telegram; запасные — для открытия в обычном браузере */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 18%, transparent);
    --gold: #ffb800;
    --radius: 20px;
    --shadow: 0 6px 24px rgba(0, 0, 0, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #1c1c1e; --bg2: #0f0f10; --text: #ffffff; --hint: #8e8e93;
      --link: #64b5ef; --btn: #2ea6ff; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(96px + env(safe-area-inset-bottom)); }
  .press:active { transform: scale(.97); transition: transform .08s; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
  h3 { font-size: 19px; margin: 24px 2px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  h3 small { font-size: 14px; color: var(--hint); font-weight: 400; }
  .muted { color: var(--hint); }
  .fade-in { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Шапка ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .city-pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow);
  }
  .city-pill span { color: var(--hint); font-size: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.big { width: 96px; height: 96px; font-size: 38px; box-shadow: 0 0 0 4px var(--bg), var(--shadow); }
  .avatar.small { width: 34px; height: 34px; font-size: 14px; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px;
    padding: 0 14px; margin-top: 16px; box-shadow: var(--shadow);
  }
  .search input { flex: 1; border: 0; background: none; color: var(--text); font: inherit; padding: 13px 0; outline: none; }

  /* ---------- Категории ---------- */
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cat {
    position: relative; overflow: hidden; border-radius: 18px; padding: 14px 12px; min-height: 104px;
    color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: space-between;
  }
  .cat .emoji { font-size: 30px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
  .cat b { font-size: 14px; line-height: 1.15; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .cat small { font-size: 12px; opacity: .85; }

  /* ---------- Большие карточки (топ) ---------- */
  .carousel {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar, .chips::-webkit-scrollbar, .gallery::-webkit-scrollbar { display: none; }
  .tile {
    flex: none; width: 240px; scroll-snap-align: start; background: var(--bg);
    border-radius: var(--radius); overflow: hidden; text-align: left; box-shadow: var(--shadow);
  }
  .tile .cover { height: 150px; }
  .tile .body { padding: 10px 12px 12px; }
  .tile b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { color: var(--hint); }

  .cover { position: relative; display: grid; place-items: center; font-size: 54px; overflow: hidden; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .badge {
    position: absolute; top: 10px; left: 10px; z-index: 1; display: inline-flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 999px;
  }
  .badge i { color: var(--gold); font-style: normal; }
  .heart {
    position: absolute; top: 8px; right: 8px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; font-size: 16px;
  }

  /* ---------- Список ---------- */
  .row-card {
    display: flex; gap: 12px; width: 100%; margin-bottom: 10px; background: var(--bg);
    border-radius: 18px; padding: 10px; text-align: left; box-shadow: var(--shadow); align-items: center;
  }
  .row-card .cover { width: 86px; height: 86px; border-radius: 14px; font-size: 34px; flex: none; }
  .row-card .info { flex: 1; min-width: 0; }
  .row-card b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-card .meta { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .stars { color: var(--gold); font-weight: 700; }
  .stars em { color: var(--hint); font-weight: 400; font-style: normal; font-size: 13px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .chip {
    flex: none; border-radius: 999px; padding: 8px 14px; font-size: 14px;
    background: var(--bg); color: var(--text); box-shadow: var(--shadow);
  }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  .chip.gold.on { background: linear-gradient(135deg, #ffb800, #ff8a00); color: #fff; }
  .flabel { font-size: 13px; color: var(--hint); margin: 14px 2px 8px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .empty .big { font-size: 46px; display: block; margin-bottom: 8px; }

  /* ---------- Страница места ---------- */
  .gallery {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: -14px -16px 0;
    height: 300px; scrollbar-width: none; position: relative;
  }
  .gallery .cover { flex: none; width: 100%; height: 100%; scroll-snap-align: start; font-size: 90px; }
  .credit { font-size: 11px; color: var(--hint); margin: 6px 2px 0; }
  .sheet {
    position: relative; background: var(--bg2); margin: -26px -16px 0; padding: 22px 16px 0;
    border-radius: 26px 26px 0 0;
  }
  .place-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .score {
    flex: none; text-align: center; background: var(--bg); border-radius: 16px; padding: 8px 12px; box-shadow: var(--shadow);
  }
  .score b { display: block; font-size: 22px; color: var(--gold); line-height: 1; }
  .score small { font-size: 11px; color: var(--hint); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .tag { font-size: 13px; background: var(--bg); border-radius: 999px; padding: 5px 10px; color: var(--hint); }
  .card { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card p { margin: 0; }
  .line { display: flex; gap: 12px; align-items: center; padding: 9px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--bg2); display: grid; place-items: center; flex: none; }

  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .action {
    background: var(--bg); border-radius: 16px; padding: 12px 4px; font-size: 12px; color: var(--link);
    text-align: center; text-decoration: none; box-shadow: var(--shadow); display: block;
  }
  .action span { display: block; font-size: 22px; margin-bottom: 4px; }
  .btn {
    display: block; width: 100%; border-radius: 14px; padding: 15px; font-weight: 600; text-align: center;
    background: var(--bg); color: var(--link); box-shadow: var(--shadow); text-decoration: none;
  }
  .btn.primary { background: var(--btn); color: var(--btn-text); }
  .btn + .btn { margin-top: 10px; }

  .review { display: flex; gap: 12px; padding: 12px 0; }
  .review + .review { border-top: 1px solid var(--line); }
  .review .who { display: flex; justify-content: space-between; gap: 8px; }
  .review p { margin: 4px 0 0; font-size: 15px; }

  /* ---------- Бронь ---------- */
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 4px 6px; }
  input.field {
    width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit;
    background: var(--bg); color: var(--text); outline: none; box-shadow: var(--shadow);
  }
  .stepper { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
  .stepper button { width: 46px; height: 46px; border-radius: 11px; background: var(--bg2); font-size: 22px; }
  .stepper b { flex: 1; text-align: center; font-size: 19px; }
  .result {
    background: linear-gradient(135deg, color-mix(in srgb, var(--btn) 14%, var(--bg)), var(--bg));
    border-radius: var(--radius); padding: 16px; margin: 18px 0 12px; user-select: text; box-shadow: var(--shadow);
  }

  /* ---------- Профиль ---------- */
  .profile-head { text-align: center; padding: 8px 0 4px; }
  .profile-head .avatar { margin: 0 auto 12px; }
  .level {
    display: inline-block; margin-top: 8px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: linear-gradient(135deg, #7b5cff, #ff5ca8); color: #fff;
  }
  .progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7b5cff, #ff5ca8); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  .stat { background: var(--bg); border-radius: 16px; padding: 12px 4px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 21px; }
  .stat small { font-size: 11px; color: var(--hint); }
  .achievements { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ach { background: var(--bg); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .ach .emoji {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; margin-bottom: 8px;
  }
  .ach b { display: block; font-size: 15px; }
  .ach small { color: var(--hint); font-size: 12px; line-height: 1.25; display: block; }
  .ach.locked .emoji { filter: grayscale(1); opacity: .45; background: var(--bg2) !important; }
  .ach.locked b { color: var(--hint); }

  /* ---------- Нижнее меню ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  }
  .tabbar div { display: flex; width: 100%; max-width: 560px; justify-content: space-around; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--hint); padding: 4px 18px; }
  .tab span { font-size: 22px; filter: grayscale(1); opacity: .6; }
  .tab.on { color: var(--btn); font-weight: 600; }
  .tab.on span { filter: none; opacity: 1; }

  /* ---------- Выбор города ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); animation: fadeOnly .2s; }
  .modal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2);
    border-radius: 24px 24px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; animation: up .25s ease; max-height: 82vh; overflow-y: auto;
  }
  .verified { display: inline-block; font-size: 12px; font-weight: 600; color: #34c77b; margin-left: 4px; }
  .more { margin-top: 4px; }
  .osm-note { font-size: 11px; color: var(--hint); text-align: center; margin: 24px 0 0; }
  .modal .grip { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
  .city-option {
    display: flex; align-items: center; gap: 14px; width: 100%; background: var(--bg); border-radius: 16px;
    padding: 14px; margin-top: 10px; text-align: left; box-shadow: var(--shadow);
  }
  .city-option .avatar { border-radius: 14px; }
  .city-option .check { margin-left: auto; color: var(--btn); font-size: 20px; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }

  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 30;
    transform: translateX(-50%) translateY(30px); opacity: 0;
    background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 999px;
    transition: .25s; pointer-events: none; font-size: 14px; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%); opacity: 1; }
  .browser-back { display: none; margin-bottom: 12px; }
  :root:not(.tg) .browser-back.visible { display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="overlay"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (inTelegram) {
  document.documentElement.classList.add("tg");
  tg.ready();
  tg.expand();
}
const me = (inTelegram && tg.initDataUnsafe.user) || { first_name: "Гость" };

const DATE_CATEGORY = "Для свидания";
const CATS = {
  "Кофейни":     { emoji: "☕", grad: "linear-gradient(135deg,#c87941,#7a3e1d)" },
  "Активности":  { emoji: "🧗", grad: "linear-gradient(135deg,#ff7a45,#ff3d71)" },
  "Еда":         { emoji: "🍽", grad: "linear-gradient(135deg,#ffb347,#ff6a3d)" },
  "Культура":    { emoji: "🎭", grad: "linear-gradient(135deg,#7b5cff,#4b33c9)" },
  "Прогулки":    { emoji: "🌳", grad: "linear-gradient(135deg,#34c77b,#119a8a)" },
  "Вечер":       { emoji: "🌙", grad: "linear-gradient(135deg,#3a4a8c,#141a3d)" },
  [DATE_CATEGORY]: { emoji: "💘", grad: "linear-gradient(135deg,#ff5ca8,#c2185b)" },
};
const catInfo = (c) => CATS[c] || { emoji: "📍", grad: "linear-gradient(135deg,#8e9eab,#5b6b78)" };
const CITY_GRADS = ["linear-gradient(135deg,#ff5f6d,#ffc371)", "linear-gradient(135deg,#36d1dc,#5b86e5)",
                    "linear-gradient(135deg,#11998e,#38ef7d)", "linear-gradient(135deg,#7b5cff,#ff5ca8)"];
const AVATAR_GRADS = ["linear-gradient(135deg,#ff8a65,#ff5252)", "linear-gradient(135deg,#7986cb,#3f51b5)",
                      "linear-gradient(135deg,#4db6ac,#00897b)", "linear-gradient(135deg,#ffb74d,#f57c00)",
                      "linear-gradient(135deg,#ba68c8,#8e24aa)", "linear-gradient(135deg,#4fc3f7,#0288d1)"];
const BUDGETS = [["any", "Любой бюджет"], ["500", "до 500 ₽"], ["1500", "до 1500 ₽"]];
const AUDIENCES = [["any", "С кем угодно"], ["один", "🙋 Один"], ["пара", "👫 Вдвоём"], ["компания", "🎉 Компанией"]];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля",
                "августа", "сентября", "октября", "ноября", "декабря"];
const TOP = 4.5;
const TAGS = {
  "спешелти": "🫘", "своя обжарка": "🔥", "завтраки": "🍳", "десерты": "🍰",
  "для работы": "💻", "терраса": "🌿", "круглосуточно": "🌙", "необычные": "✨",
  "театр": "🎭", "виды": "🏙", "квест": "🗝", "скалодром": "🧗", "боулинг": "🎳",
  "караоке": "🎤", "для детей": "🧸", "галерея": "🖼", "кино": "🎬", "бар": "🍸", "батуты": "🤸",
  "зоопарк": "🦁", "аквапарк": "🌊", "каток": "⛸", "игровые автоматы": "🕹", "парк развлечений": "🎡", "сад": "🌷",
  "картинг": "🏎", "пейнтбол и лазертаг": "🔫", "мини-гольф": "⛳", "конные прогулки": "🐎",
  "планетарий": "🔭", "арт-пространство": "🎨",
};
const PAGE = 30;
const isVerified = (p) => !!p.ratings_count;
const mapLink = (p) => `https://yandex.ru/maps/?pt=${p.lon},${p.lat}&z=17&l=map`;
const bigNum = (n) => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(".0", "")} тыс.` : String(n);
const tagLabel = (t) => `${TAGS[t] || "🏷"} ${t}`;

let botName = "";
let places = [];
let favs = new Set();
let stats = { viewed: [], bookings: 0, reviews: 0, cities: [] };
let city = null;
let state = { view: "home", tab: "home" };
const stack = [];
const app = document.getElementById("app");

// ---------- Помощники ----------

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = (type = "light") => inTelegram && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type);
const hash = (s) => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);

function plural(n, one, few, many) {
  if (n % 10 === 1 && n % 100 !== 11) return `${n} ${one}`;
  if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return `${n} ${few}`;
  return `${n} ${many}`;
}
const peopleWord = (n) => (n % 10 === 1 && n % 100 !== 11) || (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) ? "человека" : "человек";

function price(p) {
  if (p.avg_check === 0) return "бесплатно";
  if (p.avg_check && p.category === "Кофейни") return `☕ до ${p.avg_check} ₽`;
  if (p.avg_check) return `~${p.avg_check} ₽`;
  return "";
}

function stars(r) {
  return r ? `<span class="stars">★ ${r.toFixed(1)}</span>` : "";
}

function normalizeLink(link) {
  link = (link || "").trim();
  if (!link) return null;
  if (link.startsWith("@")) link = "https://t.me/" + link.slice(1);
  else if (!/^https?:\/\//.test(link)) link = "https://" + link;
  return /^https?:\/\/[^\s/]+\.[^\s/]+(\/\S*)?$/.test(link) ? link : null;
}
const isMapLink = (url) => /yandex\.[a-z]+\/maps|2gis\./.test(url);

function openLink(url) {
  if (inTelegram && /^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
  else if (inTelegram) tg.openLink(url);
  else window.open(url, "_blank");
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 1900);
}

function avatarHtml(name, photo, cls = "") {
  const grad = AVATAR_GRADS[hash(name) % AVATAR_GRADS.length];
  const letter = esc((name || "?").trim()[0] || "?").toUpperCase();
  const img = photo ? `<img src="${esc(photo)}" alt="" onerror="this.remove()">` : "";
  return `<div class="avatar ${cls}" style="background:${grad}">${letter}${img}</div>`;
}

function coverHtml(p, photoIdx = 0, extra = "") {
  const info = catInfo(p.category);
  const photo = p.photos && p.photos[photoIdx];
  return `<div class="cover" style="background:${info.grad}">${info.emoji}
    ${photo ? `<img src="${esc(photo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}${extra}</div>`;
}

// ---------- Хранилище: облако Telegram, вне Telegram — браузер ----------

const useCloud = inTelegram && tg.CloudStorage && tg.isVersionAtLeast("6.9");

function storeGet(keys) {
  return new Promise((resolve) => {
    if (useCloud) {
      tg.CloudStorage.getItems(keys, (err, values) => resolve(err ? {} : values || {}));
    } else {
      const out = {};
      try { for (const k of keys) out[k] = localStorage.getItem(k); } catch {}
      resolve(out);
    }
  });
}

function storeSet(key, value) {
  const raw = typeof value === "string" ? value : JSON.stringify(value);
  if (useCloud) tg.CloudStorage.setItem(key, raw);
  else { try { localStorage.setItem(key, raw); } catch {} }
}

const parse = (raw, fallback) => { try { return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };

// ---------- Данные ----------

function cities() {
  const count = {};
  for (const p of places) count[p.city] = (count[p.city] || 0) + 1;
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}
const inCity = () => places.filter((p) => p.city === city);

function categories() {
  const list = [];
  for (const p of inCity()) if (!list.includes(p.category) && p.category !== DATE_CATEGORY) list.push(p.category);
  if (inCity().some((p) => p.audience.includes("пара"))) list.push(DATE_CATEGORY);
  return list;
}

function inCategory(cat) {
  return cat === DATE_CATEGORY
    ? inCity().filter((p) => p.audience.includes("пара"))
    : inCity().filter((p) => p.category === cat);
}

const byRating = (a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name, "ru");

function filtered() {
  const f = state;
  return inCategory(f.category).filter((p) => {
    if (f.budget !== "any" && !(p.avg_check != null && p.avg_check <= +f.budget)) return false;
    if (f.who !== "any" && !p.audience.includes(f.who)) return false;
    if (f.district !== "any" && p.district !== f.district) return false;
    if (f.top && !(p.rating >= TOP)) return false;
    if (f.tag && f.tag !== "any" && !(p.tags || []).includes(f.tag)) return false;
    return true;
  }).sort(byRating);
}

const byId = (id) => places.find((p) => p.id === id);

// ---------- Достижения ----------

function progress() {
  const viewed = stats.viewed.map(byId).filter(Boolean);
  const inCat = (c) => viewed.filter((p) => p.category === c).length;
  return {
    viewed: viewed.length, favs: [...favs].filter(byId).length, bookings: stats.bookings, reviews: stats.reviews,
    cities: new Set(viewed.map((p) => p.city)).size,
    coffee: inCat("Кофейни"), culture: inCat("Культура"), walks: inCat("Прогулки"),
  };
}

const ACHIEVEMENTS = [
  { emoji: "👋", title: "Первый шаг", text: "Открыть приложение", key: null, goal: 1, color: "#ffe9a8" },
  { emoji: "🔎", title: "Любопытный", text: "Открыть 5 мест", key: "viewed", goal: 5, color: "#cfe4ff" },
  { emoji: "🧭", title: "Исследователь", text: "Открыть 20 мест", key: "viewed", goal: 20, color: "#d4f5e4" },
  { emoji: "☕", title: "Кофеман", text: "Заглянуть в 3 кофейни", key: "coffee", goal: 3, color: "#f3dcc8" },
  { emoji: "🎭", title: "Ценитель", text: "Открыть 3 музея", key: "culture", goal: 3, color: "#e2dbff" },
  { emoji: "🌳", title: "Гуляка", text: "Открыть 3 места для прогулок", key: "walks", goal: 3, color: "#d4f5e4" },
  { emoji: "⭐", title: "Коллекционер", text: "Сохранить 5 мест", key: "favs", goal: 5, color: "#fff1b8" },
  { emoji: "📝", title: "Планировщик", text: "Собрать текст брони", key: "bookings", goal: 1, color: "#ffd9e6" },
  { emoji: "✍️", title: "Голос города", text: "Оставить отзыв", key: "reviews", goal: 1, color: "#d9f1ff" },
  { emoji: "✈️", title: "Путешественник", text: "Места в 2 городах", key: "cities", goal: 2, color: "#e8e1ff" },
];

function achievements() {
  const pr = progress();
  return ACHIEVEMENTS.map((a) => {
    const value = a.key ? Math.min(pr[a.key], a.goal) : 1;
    return { ...a, value, done: value >= a.goal };
  });
}

function checkNewAchievements(before) {
  const now = achievements().filter((a) => a.done).map((a) => a.title);
  const fresh = now.find((t) => !before.includes(t));
  if (fresh) {
    const a = ACHIEVEMENTS.find((x) => x.title === fresh);
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    setTimeout(() => toast(`${a.emoji} Достижение: ${a.title}!`), 350);
  }
}

function track(fn) {
  const before = achievements().filter((a) => a.done).map((a) => a.title);
  fn();
  storeSet("stats", stats);
  checkNewAchievements(before);
}

// ---------- Навигация ----------

function go(view, patch = {}) {
  stack.push(state);
  state = { ...state, ...patch, view };
  haptic();
  render();
  window.scrollTo(0, 0);
}

function back() {
  if (!stack.length) return;
  state = stack.pop();
  render();
}

function switchTab(tab) {
  stack.length = 0;
  state = { view: tab, tab };
  haptic("soft");
  render();
  window.scrollTo(0, 0);
}

if (inTelegram) tg.BackButton.onClick(back);

// ---------- Экраны ----------

function rowCard(p) {
  const meta = [p.district, price(p)].filter(Boolean).join(" · ");
  return `<button class="row-card press" data-place="${p.id}">
    ${coverHtml(p)}

      <b>${esc(p.name)}</b>
      <div class="meta">${esc(catInfo(p.category).emoji + " " + p.category)}${isVerified(p) ? `<span class="verified">✓ Проверено</span>` : ""}</div>
      <div class="meta">${stars(p.rating)} ${p.ratings_count ? `<em>· ${bigNum(p.ratings_count)} оценок</em>` : ""}</div>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    </div>
    ${favs.has(p.id) ? "<span>⭐</span>" : ""}
  </button>`;
}

function tile(p) {
  const badge = p.rating ? `<span class="badge"><i>★</i>${p.rating.toFixed(1)}</span>` : "";
  return `<button class="tile press" data-place="${p.id}">
    ${coverHtml(p, 0, badge)}

function renderTabbar() {
  const tabs = [["home", "🏠", "Главная"], ["favorites", "❤️", "Избранное"], ["profile", "👤", "Профиль"]];
  const show = ["home", "favorites", "profile"].includes(state.view);
  document.getElementById("tabbar").style.display = show ? "" : "none";
  document.getElementById("tabbar").innerHTML = `<div>${tabs.map(([id, icon, label]) =>
    `<button class="tab press ${state.tab === id ? "on" : ""}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join("")}</div>`;
}

let lastView = null;

function render() {
  // Анимация только при переходе на другой экран, а не при каждом нажатии
  const animate = state.view !== lastView || state.placeId !== render.lastPlace;
  lastView = state.view;
  render.lastPlace = state.placeId;
  app.innerHTML =
    `<button class="chip browser-back ${stack.length ? "visible" : ""}" data-back>← Назад</button>` +
    `<div class="${animate ? "fade-in" : ""}">${views[state.view]()}</div>`;
  renderTabbar();
  if (inTelegram) stack.length ? tg.BackButton.show() : tg.BackButton.hide();

  const search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", () => {
      state.query = search.value;
      const pos = search.selectionStart;
      render();
      const again = document.getElementById("search");
      again.focus();
      again.setSelectionRange(pos, pos);
    });
  }

  if (state.view === "booking") {
    const update = () => {
      const b = state.booking;
      for (const k of ["date", "time", "name", "phone"]) b[k] = document.getElementById("b-" + k).value;
      document.getElementById("b-result").textContent = bookingText();
    };
    app.querySelectorAll("input").forEach((i) => i.addEventListener("input", update));
    update();
  }
}

        <button class="city-option press" data-city="${esc(c)}">
          <div class="avatar" style="background:${CITY_GRADS[i % CITY_GRADS.length]}">${esc(c[0])}</div>
          <div><b>${esc(c)}</b><div class="muted" style="font-size:14px">${plural(places.filter((p) => p.city === c).length, "место", "места", "мест")}</div></div>
          ${c === city ? `<span class="check">✓</span>` : ""}
        </button>`).join("")}
    </div>`;
  haptic();
}

function setCity(c) {
  city = c;
  storeSet("city", c);
  document.getElementById("overlay").innerHTML = "";
  stack.length = 0;
  state = { view: "home", tab: "home" };
  render();
  window.scrollTo(0, 0);
  toast(`📍 ${c}`);
}

// Один обработчик на все нажатия
document.addEventListener("click", async (e) => {
  const el = e.target.closest("button, [data-close]");
  if (!el) return;
  const d = el.dataset;

  if ("back" in d) return back();
  if ("close" in d) return (document.getElementById("overlay").innerHTML = "");
  if ("cities" in d) return openCities();
  if (d.city) return setCity(d.city);
  if (d.tab) return switchTab(d.tab);
  if (d.cat) return go("list", { category: d.cat, budget: "any", who: "any", district: "any", tag: "any", top: false });
  if (d.theme) return go("list", { category: "Кофейни", budget: "any", who: "any", district: "any", tag: d.theme, top: false });
  if (d.go) return go(d.go);
  if (d.link) return openLink(d.link);
  if (d.place) {
    const id = +d.place;
    track(() => { if (!stats.viewed.includes(id)) stats.viewed.push(id); });
    return go("place", { placeId: id, booking: null });
  }
  if ("more" in d) {
    state.limit = (state.limit || PAGE) + PAGE;
    return render();
  }
  if ("toggleTop" in d) {
    state.top = !state.top;
    state.limit = PAGE;
    haptic("soft");
    return render();
  }
  if (d.filter) {
    state[d.filter] = d.value;
    state.limit = PAGE;
    haptic("soft");
    return render();
  }
  if (d.fav) {
    const id = +d.fav;
    track(() => { favs.has(id) ? favs.delete(id) : favs.add(id); });
    storeSet("favs", [...favs]);
    haptic("medium");
    toast(favs.has(id) ? "❤️ Сохранено в избранное" : "Убрано из избранного");
    return render();
  }
  if (d.review) {
    track(() => { stats.reviews += 1; });
    return openLink(`https://t.me/${botName}?start=review_${d.review}`);
  }
  if (d.share) {
    const p = byId(+d.share);
    const text = `${p.name} — ${p.address || p.city}. Нашёл в боте «Куда сходить»`;
    const url = botName ? `https://t.me/${botName}` : location.href;
    return openLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
  }
  if (d.step) {
    const b = state.booking;
    b.guests = Math.min(50, Math.max(1, b.guests + +d.step));
    document.getElementById("b-guests").textContent = b.guests;
    document.getElementById("b-result").textContent = bookingText();
    return haptic("soft");
  }
  if (el.id === "b-copy") {
    const text = bookingText();
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("b-result"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      document.execCommand("copy");
    }
    track(() => { stats.bookings += 1; });
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    toast("📋 Скопировано! Отправь заведению");
  }
});

// ---------- Старт ----------

(async () => {
  try {
    const res = await fetch("places.json?v=" + Date.now());
    const data = await res.json();
    places = data.places || data;
    botName = data.bot || "";
  } catch {
    app.innerHTML = `<div class="empty"><span class="big">😕</span>Не удалось загрузить места.<br>Попробуй позже.</div>`;
    return;
  }
  const saved = await storeGet(["favs", "stats", "city"]);
  // Места, которых больше нет в базе, из избранного убираем
  favs = new Set(parse(saved.favs, []).filter(byId));
  stats = { ...stats, ...parse(saved.stats, {}) };
  const all = cities();
  city = all.includes(saved.city) ? saved.city : all[0];
  render();
  if (!all.includes(saved.city) && all.length > 1) openCities();
})();
</script>
