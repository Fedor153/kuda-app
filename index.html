<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Куда сходить</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берутся из темы Telegram; запасные — для открытия в обычном браузере */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 18%, transparent);
    --gold: #ffb800;
    --radius: 20px;
    /* Telegram сам задаёт эти отступы; в обычном браузере они равны 0 */
    --top-inset: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bottom-inset: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
    --shadow: 0 6px 24px rgba(0, 0, 0, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #1c1c1e; --bg2: #0f0f10; --text: #ffffff; --hint: #8e8e93;
      --link: #64b5ef; --btn: #2ea6ff; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  #app { max-width: 560px; margin: 0 auto; padding: calc(14px + var(--top-inset)) 16px calc(96px + var(--bottom-inset)); }
  .press:active { transform: scale(.97); transition: transform .08s; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 24px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
  h3 { font-size: 19px; margin: 24px 2px 12px; display: flex; align-items: baseline; justify-content: space-between; }
  h3 small { font-size: 14px; color: var(--hint); font-weight: 400; }
  .muted { color: var(--hint); }
  .fade-in { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Шапка ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .city-pill {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
    padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow);
  }
  .city-pill span { color: var(--hint); font-size: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none; overflow: hidden;
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 16px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.big { width: 96px; height: 96px; font-size: 38px; box-shadow: 0 0 0 4px var(--bg), var(--shadow); }
  .avatar.small { width: 34px; height: 34px; font-size: 14px; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 14px;
    padding: 0 14px; margin-top: 16px; box-shadow: var(--shadow);
  }
  .search input { flex: 1; border: 0; background: none; color: var(--text); font: inherit; padding: 13px 0; outline: none; }
  .addr-form { margin: 0 0 14px; padding-right: 6px; }
  .addr-form input { min-width: 0; }
  .addr-form button { border: 0; background: var(--accent, #7c5cff); color: #fff; font: inherit; font-weight: 700;
    border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .where { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin: 0 0 12px; }
  .where .muted { margin: 0; }
  .where button { flex: none; }

  /* ---------- Категории ---------- */
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cat {
    position: relative; overflow: hidden; border-radius: 18px; padding: 14px 12px; min-height: 104px;
    color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: space-between;
  }
  .cat .emoji { font-size: 30px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
  .cat b { font-size: 14px; line-height: 1.15; text-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .cat small { font-size: 12px; opacity: .85; }

  /* ---------- Большие карточки (топ) ---------- */
  .carousel {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar, .chips::-webkit-scrollbar, .gallery::-webkit-scrollbar { display: none; }
  .tile {
    flex: none; width: 240px; scroll-snap-align: start; background: var(--bg);
    border-radius: var(--radius); overflow: hidden; text-align: left; box-shadow: var(--shadow);
  }
  .tile .cover { height: 150px; }
  .tile .body { padding: 10px 12px 12px; }
  .tile b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile small { color: var(--hint); }

  .cover { position: relative; display: grid; place-items: center; font-size: 54px; overflow: hidden; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .badge {
    position: absolute; top: 10px; left: 10px; z-index: 1; display: inline-flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff; font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 999px;
  }
  .badge i { color: var(--gold); font-style: normal; }
  .heart {
    position: absolute; top: 8px; right: 8px; z-index: 1; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; place-items: center; font-size: 16px;
  }

  /* ---------- Список ---------- */
  .row-card {
    display: flex; gap: 12px; width: 100%; margin-bottom: 10px; background: var(--bg);
    border-radius: 18px; padding: 10px; text-align: left; box-shadow: var(--shadow); align-items: center;
  }
  .row-card .cover { width: 86px; height: 86px; border-radius: 14px; font-size: 34px; flex: none; }
  .row-card .info { flex: 1; min-width: 0; }
  .row-card b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-card .meta { color: var(--hint); font-size: 14px; margin-top: 2px; }
  .stars { color: var(--gold); font-weight: 700; }
  .stars em { color: var(--hint); font-weight: 400; font-style: normal; font-size: 13px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
  .chip {
    flex: none; border-radius: 999px; padding: 8px 14px; font-size: 14px;
    background: var(--bg); color: var(--text); box-shadow: var(--shadow);
  }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  .chip.gold.on { background: linear-gradient(135deg, #ffb800, #ff8a00); color: #fff; }
  .flabel { font-size: 13px; color: var(--hint); margin: 14px 2px 8px; }
  .empty { text-align: center; color: var(--hint); padding: 48px 16px; }
  .empty .big { font-size: 46px; display: block; margin-bottom: 8px; }

  /* ---------- Страница места ---------- */
  .gallery {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: calc(-14px - var(--top-inset)) -16px 0;
    height: calc(300px + var(--top-inset)); scrollbar-width: none; position: relative;
  }
  .gallery .cover { flex: none; width: 100%; height: 100%; scroll-snap-align: start; font-size: 90px; }
  .credit { font-size: 11px; color: var(--hint); margin: 6px 2px 0; }
  .sheet {
    position: relative; background: var(--bg2); margin: -26px -16px 0; padding: 22px 16px 0;
    border-radius: 26px 26px 0 0;
  }
  .place-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .score {
    flex: none; text-align: center; background: var(--bg); border-radius: 16px; padding: 8px 12px; box-shadow: var(--shadow);
  }
  .score b { display: block; font-size: 22px; color: var(--gold); line-height: 1; }
  .score small { font-size: 11px; color: var(--hint); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
  .tag { font-size: 13px; background: var(--bg); border-radius: 999px; padding: 5px 10px; color: var(--hint); }
  .card { background: var(--bg); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card p { margin: 0; }
  .line { display: flex; gap: 12px; align-items: center; padding: 9px 0; }
  .line + .line { border-top: 1px solid var(--line); }
  .line .ico { width: 30px; height: 30px; border-radius: 9px; background: var(--bg2); display: grid; place-items: center; flex: none; }

  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .action {
    background: var(--bg); border-radius: 16px; padding: 12px 4px; font-size: 12px; color: var(--link);
    text-align: center; text-decoration: none; box-shadow: var(--shadow); display: block;
  }
  .action span { display: block; font-size: 22px; margin-bottom: 4px; }
  .btn {
    display: block; width: 100%; border-radius: 14px; padding: 15px; font-weight: 600; text-align: center;
    background: var(--bg); color: var(--link); box-shadow: var(--shadow); text-decoration: none;
  }
  .btn.primary { background: var(--btn); color: var(--btn-text); }
  .btn + .btn { margin-top: 10px; }

  .review { display: flex; gap: 12px; padding: 12px 0; }
  .review + .review { border-top: 1px solid var(--line); }
  .review .who { display: flex; justify-content: space-between; gap: 8px; }
  .review p { margin: 4px 0 0; font-size: 15px; }

  /* ---------- Бронь ---------- */
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 4px 6px; }
  input.field {
    width: 100%; border: 0; border-radius: 14px; padding: 14px; font: inherit;
    background: var(--bg); color: var(--text); outline: none; box-shadow: var(--shadow);
  }
  .stepper { display: flex; align-items: center; gap: 12px; background: var(--bg); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
  .stepper button { width: 46px; height: 46px; border-radius: 11px; background: var(--bg2); font-size: 22px; }
  .stepper b { flex: 1; text-align: center; font-size: 19px; }
  .result {
    background: linear-gradient(135deg, color-mix(in srgb, var(--btn) 14%, var(--bg)), var(--bg));
    border-radius: var(--radius); padding: 16px; margin: 18px 0 12px; user-select: text; box-shadow: var(--shadow);
  }

  /* ---------- Профиль ---------- */
  .profile-head { text-align: center; padding: 8px 0 4px; }
  .profile-head .avatar { margin: 0 auto 12px; }
  .level {
    display: inline-block; margin-top: 8px; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: linear-gradient(135deg, #7b5cff, #ff5ca8); color: #fff;
  }
  .progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #7b5cff, #ff5ca8); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
  .stat { background: var(--bg); border-radius: 16px; padding: 12px 4px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 21px; }
  .stat small { font-size: 11px; color: var(--hint); }
  .achievements { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ach { background: var(--bg); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .ach .emoji {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; margin-bottom: 8px;
  }
  .ach b { display: block; font-size: 15px; }
  .ach small { color: var(--hint); font-size: 12px; line-height: 1.25; display: block; }
  .ach.locked .emoji { filter: grayscale(1); opacity: .45; background: var(--bg2) !important; }
  .ach.locked b { color: var(--hint); }

  /* ---------- Нижнее меню ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 8px 16px calc(8px + var(--bottom-inset));
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line);
  }
  .tabbar div { display: flex; width: 100%; max-width: 560px; justify-content: space-around; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--hint); padding: 4px 18px; }
  .tab span { font-size: 22px; filter: grayscale(1); opacity: .6; }
  .tab.on { color: var(--btn); font-weight: 600; }
  .tab.on span { filter: none; opacity: 1; }

  /* ---------- Выбор города ---------- */
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); animation: fadeOnly .2s; }
  .modal {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2);
    border-radius: 24px 24px 0 0; padding: 10px 16px calc(24px + var(--bottom-inset));
    max-width: 560px; margin: 0 auto; animation: up .25s ease; max-height: 82vh; overflow-y: auto;
  }
  .verified { display: inline-block; font-size: 12px; font-weight: 600; color: #34c77b; margin-left: 4px; }
  .more { margin-top: 4px; }
  .osm-note { font-size: 11px; color: var(--hint); text-align: center; margin: 24px 0 0; }
  .modal .grip { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
  .city-option {
    display: flex; align-items: center; gap: 14px; width: 100%; background: var(--bg); border-radius: 16px;
    padding: 14px; margin-top: 10px; text-align: left; box-shadow: var(--shadow);
  }
  .city-option .avatar { border-radius: 14px; }
  .city-option .check { margin-left: auto; color: var(--btn); font-size: 20px; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }

  #toast {
    position: fixed; left: 50%; bottom: calc(90px + var(--bottom-inset)); z-index: 30;
    transform: translateX(-50%) translateY(30px); opacity: 0;
    background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 999px;
    transition: .25s; pointer-events: none; font-size: 14px; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%); opacity: 1; }
  .browser-back { display: none; margin-bottom: 12px; }
  :root:not(.tg) .browser-back.visible { display: inline-block; }

  /* «Рядом со мной» */
  .near-btn { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 12px; padding: 12px 14px;
    border-radius: 18px; text-align: left; color: var(--text);
    background: linear-gradient(135deg, rgba(52, 199, 123, .28), rgba(74, 140, 255, .22)); border: 1px solid rgba(255, 255, 255, .1); }
  .near-btn .near-anim { width: 38px; height: 38px; }
  .near-btn b { display: block; } .near-btn small { color: var(--hint); }
  .near-btn i { margin-left: auto; font-style: normal; font-size: 26px; color: var(--hint); }

  /* Окно приглашения */
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 6px; }
  .kind { padding: 16px 10px; border-radius: 18px; background: rgba(255, 255, 255, .08); color: var(--text);
    border: 2px solid transparent; font-weight: 600; }
  .kind span { display: block; font-size: 30px; margin-bottom: 4px; }
  .kind.on { border-color: #ff5ca8; background: rgba(255, 92, 168, .18); }
  .invite-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .invite-note { font-size: 13px; color: var(--hint); margin: 12px 2px; }
  .btn.love { background: linear-gradient(135deg, #ff4f9a, #ff2d6f); color: #fff; }

  /* Кнопки карт */
  .maps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .map-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 8px; border-radius: 16px;
    font-weight: 600; font-size: 14px; color: #fff; box-shadow: var(--shadow); }
  .map-btn b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: #fff; }
  .map-btn.yandex { background: linear-gradient(135deg, #ff4d4d, #fc3f1d); }
  .map-btn.yandex b { color: #fc3f1d; }
  .map-btn.google { background: linear-gradient(135deg, #4c8bf5, #1a73e8); }
  .map-btn.google b { color: #1a73e8; }
  .card.about p { font-size: 16px; line-height: 1.5; }

  /* ---------- Анимации и новый дизайн ---------- */
  .anim { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; object-fit: contain; }
  .cover .cover-emoji { width: 46%; height: 46%; max-width: 110px; max-height: 110px; position: relative;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.25)); }
  .cover img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Обложки-иллюстрации для мест без фото */
  .cover.art::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.5px) 0 0 / 14px 14px,
                linear-gradient(to top, rgba(0,0,0,.28), transparent 45%); }
  .art-deco { position: absolute; inset: 0; pointer-events: none; }
  .art-deco span { position: absolute; font-size: 22px; line-height: 1; opacity: .5; filter: saturate(.9);
    transform: rotate(var(--r)) scale(var(--s)); animation: deco-float 6s ease-in-out var(--d) infinite; }
  .art-plate { position: absolute; width: 58%; aspect-ratio: 1; max-width: 170px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.32), rgba(255,255,255,.06) 60%, transparent 70%); }
  .cover .cover-emoji.text { width: auto; height: auto; font-size: 1.1em; line-height: 1; }
  .row-card .art-deco span { font-size: 13px; }
  .row-card .art-deco span:nth-child(n+4) { display: none; }
  .gallery .art-deco span { font-size: 38px; }
  .gallery .cover.art::before { content: "иллюстрация"; position: absolute; right: 12px; bottom: 12px; z-index: 2;
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,.85); background: rgba(0,0,0,.28);
    padding: 3px 8px; border-radius: 999px; backdrop-filter: blur(6px); }
  .tile .art-deco span { font-size: 24px; }
  @keyframes deco-float { 50% { transform: rotate(var(--r)) scale(var(--s)) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .art-deco span { animation: none; } }
  .cat .emoji { font-size: 34px; line-height: 1; }
  .cat .emoji .anim { width: 40px; height: 40px; }
  .cat { box-shadow: 0 10px 24px -10px rgba(0,0,0,.45); }
  .cat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%);
    transform: translateX(-120%); animation: shine 4.5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .35s); }
  @keyframes shine { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

  .hero { position: relative; overflow: hidden; border-radius: 28px; padding: 16px 16px 22px; margin: 0 -4px;
    color: #fff; isolation: isolate; box-shadow: 0 16px 40px -18px rgba(90, 60, 255, .6); }
  .aurora { position: absolute; inset: -40%; z-index: -1;
    background: conic-gradient(from 0deg, #7b5cff, #ff5ca8, #ffb347, #34c7a8, #4a8cff, #7b5cff);
    filter: blur(40px) saturate(1.2); animation: spin 14s linear infinite; }
  .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(10, 10, 30, .25); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hero h1 { color: #fff; margin-top: 4px; text-shadow: 0 2px 12px rgba(0,0,0,.2); }
  .hero .wave { width: 34px; height: 34px; vertical-align: -6px; }
  .hero-sub { margin: 8px 0 0; color: rgba(255,255,255,.85); max-width: 74%; }
  .hero .topbar { margin-bottom: 14px; }
  .glass { background: rgba(255,255,255,.18) !important; color: #fff !important; backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); box-shadow: none !important; }
  .glass span { color: rgba(255,255,255,.75) !important; }
  .floaty { position: absolute; z-index: 0; opacity: .9; animation: float 6s ease-in-out infinite; pointer-events: none; }
  .floaty .anim { width: 34px; height: 34px; }
  .f1 { right: 22px; top: 70px; } .f2 { right: 90px; top: 112px; animation-delay: -2s; } .f3 { right: 36px; top: 140px; animation-delay: -4s; }
  .f2 .anim { width: 26px; height: 26px; } .f3 .anim { width: 30px; height: 30px; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(8deg); } }

  .stagger { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .row-card:active, .tile:active, .cat:active { transform: scale(.97); }

  if (tg.isVersionAtLeast("8.0")) {
    try { tg.requestFullscreen(); } catch {}
    if (mobile) { try { tg.lockOrientation(); } catch {} }
  }
  // Чтобы приложение не закрывалось, когда листаешь список вниз
  if (tg.isVersionAtLeast("7.7")) {
    try { tg.disableVerticalSwipes(); } catch {}

  if (n % 10 === 1 && n % 100 !== 11) return `${n} ${one}`;

function coverTheme(p) {
  for (const t of p.tags || []) if (TAG_THEME[t]) return COVER_THEMES[TAG_THEME[t]];
  if (p.category === "Кофейни" && (p.tags || []).includes("для работы")) return COVER_THEMES.work;
  return COVER_THEMES[CAT_THEME[p.category]] || COVER_THEMES.food;
}

// Простой генератор случайных чисел от id: у места всегда одна и та же обложка
function seeded(n) {
  let x = (n * 2654435761) >>> 0 || 1;
  return () => ((x = (x ^ (x << 13)) >>> 0, x = (x ^ (x >>> 17)) >>> 0, x = (x ^ (x << 5)) >>> 0) % 10000) / 10000;
}

function artCover(p) {
  const th = coverTheme(p), rnd = seeded(p.id + 7);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const [a, b] = pick(th.grads);
  const [code, emoji] = pick(th.main);
  const deco = [...th.deco].filter((ch) => !/[\u200d\ufe0f]/.test(ch));
  // 6 мелких эмодзи по краям, чтобы не закрывать главный
  const spots = [[8, 12], [78, 8], [86, 58], [10, 66], [46, 84], [62, 26], [24, 38]].sort(() => rnd() - 0.5).slice(0, 6);
  const small = spots.map(([x, y], i) => `<span style="left:${x + rnd() * 6}%;top:${y + rnd() * 6}%;
    --r:${Math.round(rnd() * 50 - 25)}deg;--s:${(0.75 + rnd() * 0.6).toFixed(2)};--d:${(i * 0.7).toFixed(1)}s">${deco[Math.floor(rnd() * deco.length)]}</span>`).join("");
  const angle = Math.round(110 + rnd() * 70);
  const glow = `radial-gradient(circle at ${Math.round(20 + rnd() * 60)}% ${Math.round(15 + rnd() * 30)}%, rgba(255,255,255,.35), transparent 55%)`;
  const main = code ? anim(code, emoji, "anim cover-emoji") : `<span class="cover-emoji text">${emoji}</span>`;
  return { bg: `${glow}, linear-gradient(${angle}deg, ${a}, ${b})`, html: `<div class="art-deco">${small}</div><div class="art-plate"></div>${main}` };
}

function coverHtml(p, photoIdx = 0, extra = "") {
  const photo = p.photos && p.photos[photoIdx];
  if (photo) {
    const info = catInfo(p.category);
    return `<div class="cover" style="background:${info.grad}">${anim(info.anim, info.emoji, "anim cover-emoji")}
      <img class="photo" src="${esc(photo)}" alt="" loading="lazy" onerror="this.remove()">${extra}</div>`;
  }
  const art = artCover(p);
  return `<div class="cover art" style="background:${art.bg}">${art.html}${extra}</div>`;
}

const useCloud = inTelegram && tg.CloudStorage && tg.isVersionAtLeast("6.9");

function storeGet(keys) {
  return new Promise((resolve) => {
    if (useCloud) {
      tg.CloudStorage.getItems(keys, (err, values) => resolve(err ? {} : values || {}));
    } else {
      const out = {};
      try { for (const k of keys) out[k] = localStorage.getItem(k); } catch {}
      resolve(out);
    }
  });
}

function storeSet(key, value) {
  const raw = typeof value === "string" ? value : JSON.stringify(value);
  if (useCloud) tg.CloudStorage.setItem(key, raw);
  else { try { localStorage.setItem(key, raw); } catch {} }
}

const parse = (raw, fallback) => { try { return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };

function cities() {
  const count = {};
  for (const p of places) count[p.city] = (count[p.city] || 0) + 1;
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
}
const inCity = () => places.filter((p) => p.city === city);

function categories() {
  const list = [];
  for (const p of inCity()) if (!list.includes(p.category) && p.category !== DATE_CATEGORY) list.push(p.category);
  if (inCity().some(isDateSpot)) list.push(DATE_CATEGORY);
  return list;
}

// Для свидания: проверенные места «для пары» и романтичные по теме
const DATE_TAGS = ["виды", "театр", "сад", "терраса", "кино", "каток", "парк развлечений", "планетарий"];
const isDateSpot = (p) => p.audience.includes("пара") && (isVerified(p) || (p.tags || []).some((t) => DATE_TAGS.includes(t)));

function inCategory(cat) {
  return cat === DATE_CATEGORY
    ? inCity().filter(isDateSpot)
    : inCity().filter((p) => p.category === cat);
}

// При равном рейтинге выше те, у кого есть фото
const byRating = (a, b) => (b.rating || 0) - (a.rating || 0) || (b.photos.length > 0) - (a.photos.length > 0) || a.name.localeCompare(b.name, "ru");

function filtered() {
  const f = state;
  return inCategory(f.category).filter((p) => {
    if (f.budget !== "any" && !(p.avg_check != null && p.avg_check <= +f.budget)) return false;
    if (f.who !== "any" && !p.audience.includes(f.who)) return false;
    if (f.district !== "any" && p.district !== f.district) return false;
    if (f.top && !(p.rating >= TOP)) return false;
    if (f.tag && f.tag !== "any" && !(p.tags || []).includes(f.tag)) return false;
    return true;
  }).sort(byRating);
}

const byId = (id) => places.find((p) => p.id === id);

function progress() {
  const viewed = stats.viewed.map(byId).filter(Boolean);
  const inCat = (c) => viewed.filter((p) => p.category === c).length;
  return {
    viewed: viewed.length, favs: [...favs].filter(byId).length, bookings: stats.bookings, reviews: stats.reviews,
    invites: stats.invites || 0,
    cities: new Set(viewed.map((p) => p.city)).size,
    coffee: inCat("Кофейни"), culture: inCat("Культура"), walks: inCat("Прогулки"),

}

function achievements() {
  const pr = progress();
  return ACHIEVEMENTS.map((a) => {
    const value = a.key ? Math.min(pr[a.key], a.goal) : 1;
    return { ...a, value, done: value >= a.goal };
  });
}

function checkNewAchievements(before) {
  const now = achievements().filter((a) => a.done).map((a) => a.title);
  const fresh = now.find((t) => !before.includes(t));
  if (fresh) {
    const a = ACHIEVEMENTS.find((x) => x.title === fresh);
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    setTimeout(() => { confetti(); achievementPopup(a); }, 350);
  }
}

function track(fn) {
  const before = achievements().filter((a) => a.done).map((a) => a.title);
  fn();
  storeSet("stats", stats);
  checkNewAchievements(before);
}

// ---------- Навигация ----------

function go(view, patch = {}) {
  stack.push(state);
  state = { ...state, ...patch, view };
  haptic();
  render();
  window.scrollTo(0, 0);
}

function back() {
  if (!stack.length) return;
  state = stack.pop();
  render();
}

function switchTab(tab) {
  stack.length = 0;
  state = { view: tab, tab };
  haptic("soft");
  render();
  window.scrollTo(0, 0);
}

if (inTelegram) tg.BackButton.onClick(back);

function rowCard(p, i = 0) {
  const dist = distanceTo(p);
  const meta = [dist !== null ? `📍 ${fmtDist(dist)}` : "", p.district, price(p)].filter(Boolean).join(" · ");
  return `<button class="row-card press stagger" style="--i:${Math.min(i, 12)}" data-place="${p.id}">
    ${coverHtml(p)}
    <div class="info">
      <b>${esc(p.name)}</b>
      <div class="meta">${esc(catInfo(p.category).emoji + " " + p.category)}${isVerified(p) ? `<span class="verified">✓ Проверено</span>` : ""}</div>
      <div class="meta">${stars(p.rating)} ${p.ratings_count ? `<em>· ${bigNum(p.ratings_count)} оценок</em>` : ""}</div>
      ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    </div>
    ${favs.has(p.id) ? "<span>⭐</span>" : ""}
  </button>`;
}

function tile(p, i = 0) {
  const badge = p.rating ? `<span class="badge"><i>★</i>${p.rating.toFixed(1)}</span>` : "";
  return `<button class="tile press stagger" style="--i:${Math.min(i, 8)}" data-place="${p.id}">
    ${coverHtml(p, 0, badge)}
    <div class="body"><b>${esc(p.name)}</b><small>${esc([catInfo(p.category).emoji + " " + p.category, price(p)].filter(Boolean).join(" · "))}</small></div>
  </button>`;
}

let lastView = null;

function render() {
  // Анимация только при переходе на другой экран, а не при каждом нажатии
  const animate = state.view !== lastView || state.placeId !== render.lastPlace;
  lastView = state.view;
  render.lastPlace = state.placeId;
  app.innerHTML =
    `<button class="chip browser-back ${stack.length ? "visible" : ""}" data-back>← Назад</button>` +
    `<div class="${animate ? "fade-in" : ""}">${views[state.view]()}</div>`;
  renderTabbar();
  if (inTelegram) stack.length ? tg.BackButton.show() : tg.BackButton.hide();

  const search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", () => {
      state.query = search.value;
      const pos = search.selectionStart;
      render();
      const again = document.getElementById("search");
      again.focus();
      again.setSelectionRange(pos, pos);
    });
  }

  const addrForm = document.getElementById("addr-form");
  if (addrForm) {
    addrForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = document.getElementById("addr").value.trim();
      if (value) findByAddress(value);
    });
  }

  if (state.view === "booking") {
    const update = () => {
      const b = state.booking;
      for (const k of ["date", "time", "name", "phone"]) b[k] = document.getElementById("b-" + k).value;
      document.getElementById("b-result").textContent = bookingText();
    };
    app.querySelectorAll("input").forEach((i) => i.addEventListener("input", update));
    update();
  }
}

// Один обработчик на все нажатия
document.addEventListener("click", async (e) => {
  const el = e.target.closest("button, [data-close]");
  if (!el) return;
  const d = el.dataset;

  if ("back" in d) return back();
  if ("close" in d) return (document.getElementById("overlay").innerHTML = "");
  if ("cities" in d) return openCities();
  if (d.city) return setCity(d.city);
  if (d.tab) return switchTab(d.tab);
  if (d.cat) return go("list", { category: d.cat, budget: "any", who: "any", district: "any", tag: "any", top: false });
  if (d.theme) return go("list", { category: "Кофейни", budget: "any", who: "any", district: "any", tag: d.theme, top: false });
  if (d.go) return go(d.go);
  if (d.link) return openLink(d.link);
  if (d.place) {
    const id = +d.place;
    track(() => { if (!stats.viewed.includes(id)) stats.viewed.push(id); });
    return go("place", { placeId: id, booking: null });
  }
  if ("more" in d) {
    state.limit = (state.limit || PAGE) + PAGE;
    return render();
  }
  if ("toggleTop" in d) {
    state.top = !state.top;
    state.limit = PAGE;
    haptic("soft");
    return render();
  }
  if (d.filter) {
    state[d.filter] = d.value;
    state.limit = PAGE;
    haptic("soft");
    return render();
  }
  if (d.fav) {
    const id = +d.fav;
    track(() => { favs.has(id) ? favs.delete(id) : favs.add(id); });
    storeSet("favs", [...favs]);
    haptic("medium");
    toast(favs.has(id) ? "❤️ Сохранено в избранное" : "Убрано из избранного");
    return render();
  }
  if (d.review) {
    track(() => { stats.reviews += 1; });
    return openLink(`https://t.me/${botName}?start=review_${d.review}`);
  }
  if ("near" in d) return findNearby();
  if (d.nearCat) {
    state.nearCat = d.nearCat;
    state.limit = PAGE;
    haptic("soft");
    return render();
  }
  if ("geoSettings" in d) { try { tg.LocationManager.openSettings(); } catch {} return; }
  if (d.meet) return openLink(`https://t.me/${botName}?start=meet_${d.meet}`);
  if (d.invite) return openInvite(byId(+d.invite));
  if (d.inviteKind) {
    document.querySelectorAll("[data-invite-kind]").forEach((b) => b.classList.toggle("on", b === el));
    return haptic("soft");
  }
  if (d.inviteMeet) {
    document.querySelectorAll("[data-invite-meet]").forEach((b) => b.classList.toggle("on", b === el));
    return haptic("soft");
  }
  if (d.inviteSend) return sendInvite(byId(+d.inviteSend));
  if (d.share) {
    const p = byId(+d.share);
    const text = `${p.name} — ${p.address || p.city}. Нашёл в боте «Куда сходить»`;
    const url = botName ? `https://t.me/${botName}` : location.href;
    return openLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
  }
  if (d.step) {
    const b = state.booking;
    b.guests = Math.min(50, Math.max(1, b.guests + +d.step));
    document.getElementById("b-guests").textContent = b.guests;
    document.getElementById("b-result").textContent = bookingText();
    return haptic("soft");
  }
  if (el.id === "b-copy") {
    const text = bookingText();
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById("b-result"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      document.execCommand("copy");
    }
    track(() => { stats.bookings += 1; });
    if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    toast("📋 Скопировано! Отправь заведению");
  }
});




// ---------- Где я: геопозиция и расстояния ----------

let userPos = null;

function distanceTo(p) {
  if (!userPos || !p.lat || !p.lon) return null;
  const R = 6371, rad = Math.PI / 180;
  const dLat = (p.lat - userPos.lat) * rad, dLon = (p.lon - userPos.lon) * rad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(userPos.lat * rad) * Math.cos(p.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function fmtDist(km) {
  if (km < 1) return `${Math.max(10, Math.round(km * 100) * 10)} м`;
  return `${km.toFixed(km < 10 ? 1 : 0).replace(".", ",")} км`;
}

// Сначала спрашиваем Telegram (Bot API 8.0), иначе — обычную геолокацию браузера
function locate() {
  return new Promise((resolve, reject) => {
    const browser = () => {
      if (!navigator.geolocation) return reject(new Error("нет геолокации"));
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    };
    const lm = inTelegram && tg.LocationManager && tg.isVersionAtLeast("8.0") ? tg.LocationManager : null;
    if (!lm) return browser();
    const ask = () => {
      if (!lm.isLocationAvailable) return browser();
      lm.getLocation((loc) => (loc ? resolve({ lat: loc.latitude, lon: loc.longitude }) : reject(new Error("нет доступа"))));
    };
    lm.isInited ? ask() : lm.init(ask);
  });
}

async function findNearby() {
  if (state.view !== "nearby") go("nearby", { nearCat: "all", limit: PAGE });
  state.locating = true;
  state.posLabel = "";
  state.addrError = false;
  render();
  try {
    userPos = await locate();
  } catch {
    userPos = null;
  }
  state.locating = false;
  switchToNearestCity();
}

async function findByAddress(text) {
  state.addr = text;
  state.locating = "addr";
  state.addrError = false;
  render();
  const found = await geocodeAddress(text, city);
  state.locating = false;
  if (!found) {
    state.addrError = true;
    haptic("error");
    return render();
  }
  userPos = { lat: found.lat, lon: found.lon };
  state.posLabel = found.label;
  state.nearCat = "all";
  state.limit = PAGE;
  switchToNearestCity();
}

function switchToNearestCity() {
  // Если ты в другом городе из базы — переключаемся на него
  const nearest = places.filter((p) => p.lat && p.lon).map((p) => [distanceTo(p), p]).sort((a, b) => a[0] - b[0])[0];
  if (nearest && nearest[0] < 50 && nearest[1].city !== city) {
    city = nearest[1].city;
    storeSet("city", city);
    toast(`📍 Похоже, ты в городе ${city}`);
  }
  haptic("medium");
  render();
}

// ---------- Адрес -> координаты (Nominatim, OpenStreetMap) ----------
// Те же правила, что в боте (geocode.py): падежи улиц, метро, сначала в выбранном городе

const STREET = "улиц|ул\\.?|просп|пр-т|бульвар|б-р|переул|пер\\.|площад|пл\\.|набережн|наб\\.|шоссе|проезд|тупик|аллея|аллее|метро|м\\.|станци|вокзал|парк|сквер";
const STREET_CASES = [["бульваре", "бульвар"], ["проспекте", "проспект"], ["переулке", "переулок"], ["проезде", "проезд"],
  ["тупике", "тупик"], ["улице", "улица"], ["набережной", "набережная"], ["площади", "площадь"], ["аллее", "аллея"]];
const W = "[а-яёa-z]";  // \b в JS не понимает русские буквы — границы слов пишем сами
const wordRe = (w, flags = "gi") => new RegExp(`(^|[^а-яёa-z])${w}(?=$|[^а-яёa-z])`, flags);

function addrClean(text) {
  text = text.trim().replace(/^[.!?]+|[.!?]+$/g, "");
  const stripped = text.replace(/^\s*(я\s+)?(сейчас\s+)?(нахожусь|стою|живу|тут|здесь)?\s*(на|у|в|около|возле|рядом с)?\s+/i, "").trim();
  return stripped.length >= 3 ? stripped : text;
}

function addrNominative(text) {
  let out = text;
  for (const [from, to] of STREET_CASES) out = out.replace(wordRe(from), `$1${to}`);
  if (out === text) return text;
  const end = "(?=$|[^а-яёa-z])";
  if (/улица|набережная|площадь|аллея/i.test(out)) {
    out = out.replace(new RegExp(`(${W}{3,})ой${end}`, "gi"), "$1ая").replace(new RegExp(`(${W}{3,})ей${end}`, "gi"), "$1яя");
  } else {
    out = out.replace(new RegExp(`(${W}{2,})ском${end}`, "gi"), "$1ский").replace(new RegExp(`(${W}{2,})цком${end}`, "gi"), "$1цкий")
      .replace(new RegExp(`(${W}{2,})ном${end}`, "gi"), "$1ный").replace(new RegExp(`(${W}{2,})ом${end}`, "gi"), "$1ый");
  }
  return out;
}

function addrMatches(query, found) {
  const words = (query.toLowerCase().match(/[а-яёa-z]{4,}/g) || []).filter((w) => !new RegExp(`^(${STREET}|станц|город)`).test(w));
  return !words.length || found.display_name.toLowerCase().replace(/ё/g, "е").includes(words[0].slice(0, 4).replace(/ё/g, "е"));
}

function addrLabel(f) {
  const a = f.address || {};
  if (f.category === "railway" && f.name) return /метро/i.test(f.name) ? f.name : `метро ${f.name}`;
  const road = a.road || a.pedestrian || a.square;
  const town = a.city || a.town || a.village || a.state;
  if (road) return [road, a.house_number, town].filter(Boolean).join(", ");
  return [...f.display_name.split(", ").slice(0, 2), town].filter(Boolean).join(", ");
}

async function geocodeAddress(text, cityName) {
  const query = addrClean(text.slice(0, 200));
  const variants = [query, addrNominative(query)];
  const metro = query.replace(/(станция\s+)?(метро|м\.)\s*/gi, "").trim();
  if (metro !== query) variants.unshift(metro);
  const uniq = [...new Set(variants)];
  const attempts = [...new Set([
    ...uniq.filter((v) => cityName && !v.toLowerCase().includes(cityName.toLowerCase())).map((v) => `${v}, ${cityName}`),
    ...uniq])];
  for (const q of attempts) {
    try {
      const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({
        q, format: "jsonv2", limit: "1", countrycodes: "ru", addressdetails: "1", "accept-language": "ru" });
      const res = await (await fetch(url)).json();
      if (res[0] && addrMatches(query, res[0])) {
        return { lat: +res[0].lat, lon: +res[0].lon, label: addrLabel(res[0]) };
      }
    } catch {}
    await new Promise((r) => setTimeout(r, 1100));  // правило Nominatim: не чаще раза в секунду
  }
  return null;
}

  const name = me.first_name === "Гость" ? "" : me.first_name;
  overlay.innerHTML = `
    <div class="backdrop" data-close></div>

      <div class="grip"></div>
      <h2>💌 Позвать в «${esc(p.name)}»</h2>
      <p class="muted" style="margin:0">Отправим милую открытку — ответить «нет» там не получится 😉</p>
      <div class="kinds">
        <button class="kind press on" data-invite-kind="date"><span>💘</span>На свидание</button>
        <button class="kind press" data-invite-kind="friend"><span>🤝</span>Другу</button>
      </div>
      <div class="invite-row">
        <div><label>Дата (можно пропустить)</label><input class="field" type="date" id="inv-date"></div>
        <div><label>Время</label><input class="field" type="time" id="inv-time"></div>
      </div>
      <label>Как встречаемся</label>
      <div class="kinds" style="margin-top:0">
        <button class="kind press on" data-invite-meet="meet"><span>📍</span>Встретимся там</button>
        <button class="kind press" data-invite-meet="pickup"><span>🚗</span>Я заберу</button>
      </div>
      <label>Как подписать</label><input class="field" id="inv-name" value="${esc(name)}" placeholder="Твоё имя">
      <p class="invite-note">${me.username ? "В открытке будет кнопка «Ответить в Telegram» — она ведёт в чат с тобой." :
        "У тебя нет @username в Telegram, поэтому ответить тебе из открытки не получится — тебе напишут сами."}</p>
      <button class="btn love press" data-invite-send="${p.id}">Отправить открытку 💌</button>
    </div>`;
  haptic();
}

function inviteLink(p) {
  const kind = document.querySelector("[data-invite-kind].on")?.dataset.inviteKind || "date";
  const date = document.getElementById("inv-date").value;
  const time = document.getElementById("inv-time").value;
  const data = {
    p: p.id, k: kind, n: document.getElementById("inv-name").value.trim().slice(0, 30) || "Кто-то",
    m: document.querySelector("[data-invite-meet].on")?.dataset.inviteMeet || "meet",
    u: me.username || "", w: date || time ? `${date}T${time}` : "",
    pn: p.name, pa: p.address || "", pc: p.city, la: p.lat || null, lo: p.lon || null,
  };
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  const b64 = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return { url: new URL("invite.html", location.href).href.split("#")[0] + "#" + b64, kind };
}

async function sendInvite(p) {
  if (!p) return;
  const { url, kind } = inviteLink(p);
  const text = kind === "date" ? "💌 У меня для тебя кое-что есть… Открой 👀" : "👀 Смотри, куда я тебя зову!";
  track(() => { stats.invites = (stats.invites || 0) + 1; });
  document.getElementById("overlay").innerHTML = "";
  if (inTelegram) {
    // Обычное окно Telegram «Переслать» — человек сам выбирает, кому отправить
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
  } else if (navigator.share) {
    try { await navigator.share({ title: "💌 Приглашение", text, url }); } catch {}
  } else {
    try { await navigator.clipboard.writeText(url); toast("🔗 Ссылка на открытку скопирована"); } catch { window.open(url, "_blank"); }
  }
}

function skeleton() {

}

const INTRO = [
  { anim: "1f929", emoji: "🤩", title: "Куда сходить?", text: "Тысячи кафе, музеев, парков и развлечений в 14 городах — всё в одном месте." },
  { anim: "1f525", emoji: "🔥", title: "Только лучшее", text: "Фильтры по теме, бюджету и рейтингу. Места с пометкой «✓ Проверено» — с высоким рейтингом на картах." },
  { anim: "1f3c6", emoji: "🏆", title: "Отзывы и награды", text: "Сохраняй места, собирай текст для брони в один тап, пиши отзывы и открывай достижения." },
];

function showIntro(done) {
  let step = 0;
  const el = document.createElement("div");
  el.className = "intro";
  el.innerHTML = `<div class="aurora"></div>
    <button class="skip" data-intro-skip>Пропустить</button>
    <div class="slides">${INTRO.map((s) => `<div class="slide">
      <img class="big-anim" src="${NOTO}${s.anim}/512.webp" alt="${s.emoji}">
      <h2>${s.title}</h2><p>${s.text}</p></div>`).join("")}</div>
    <div class="dots">${INTRO.map(() => "<i></i>").join("")}</div>
    <button class="next press" data-intro-next>Дальше</button>`;
  document.body.appendChild(el);
  const slides = el.querySelector(".slides");
  const update = () => {
    slides.style.transform = `translateX(${-step * 100}%)`;
    el.querySelectorAll(".dots i").forEach((d, i) => d.classList.toggle("on", i === step));
    el.querySelector(".next").textContent = step === INTRO.length - 1 ? "Начать 🚀" : "Дальше";
  };
  const finish = () => {
    storeSet("intro", "1");
    el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(() => { el.remove(); done && done(); }, 300);
  };
  const go = (dir) => {
    if (step + dir >= INTRO.length) return finish();
    step = Math.max(0, step + dir);
    haptic("soft");
    update();
  };
  el.addEventListener("click", (e) => {
    if (e.target.closest("[data-intro-skip]")) finish();
    if (e.target.closest("[data-intro-next]")) go(1);
  });
  // Свайпы влево-вправо
  let x0 = null;
  el.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  el.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    x0 = null;
  });
  update();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#ff5ca8", "#ffb800", "#7b5cff", "#34c77b", "#4a8cff", "#ff7a45"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
    c.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    c.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    c.style.animationDelay = (Math.random() * .3) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

function achievementPopup(a) {
  const el = document.createElement("div");
  el.className = "ach-pop";
  el.innerHTML = `${anim(a.anim, a.emoji)}<small>Новое достижение</small><b>${a.title}</b><span class="muted">${a.text}</span>`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = "0"; }, 2200);
  setTimeout(() => el.remove(), 2700);
}

  const saved = await storeGet(["favs", "stats", "city", "intro"]);

  favs = new Set(parse(saved.favs, []).filter(byId));
  stats = { ...stats, ...parse(saved.stats, {}) };
  const all = cities();
  city = all.includes(saved.city) ? saved.city : all[0];

  if (!saved.intro) showIntro(() => { if (askCity) openCities(); });
  else if (askCity) openCities();
})();
